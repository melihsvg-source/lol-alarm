<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LoL Minimap Dedektörü</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h2 { margin: 8px 0; font-size: 1.1rem; }
    .video-container {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    video { width: 100%; display: block; }
    .target-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 190px;
      height: 190px;
      border: 3px dashed #ef4444;
      border-radius: 8px;
      pointer-events: none;
    }
    .status-badge {
      display: inline-block;
      margin: 10px 0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #334155;
    }
    .status-alert {
      background: #dc2626 !important;
      animation: pulse 0.25s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 420px;
      margin: 10px auto;
    }
    button, label.file-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    label.file-btn { background: #059669; display: block; }
    input[type="file"] { display: none; }
    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    input[type="range"] { flex: 1; margin: 0 10px; }
  </style>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
</head>
<body>

  <h2>LoL Minimap Dedektörü</h2>
  <div id="status" class="status-badge">Sistem Hazırlanıyor...</div>

  <div class="video-container">
    <video id="videoInput" playsinline autoplay muted></video>
    <div class="target-box" id="targetBox"></div>
  </div>

  <div class="controls">
    <button id="startCamBtn" disabled onclick="startCamera()">1. Kamerayı Başlat</button>
    
    <label class="file-btn">
      2. Şampiyon İkonunu Seç (.png)
      <input type="file" id="templateInput" accept="image/*" onchange="loadTemplate(event)">
    </label>

    <div class="slider-row">
      <span>Eşik Değeri:</span>
      <input type="range" id="threshold" min="0.55" max="0.90" step="0.02" value="0.70">
      <span id="threshVal">0.70</span>
    </div>
  </div>

  <canvas id="hiddenCanvas" style="display:none;"></canvas>

  <script>
    let cvReady = false;
    let baseTemplateMat = null;
    let templateScales = [];
    let isProcessing = false;
    let lastAlertTime = 0;
    const alertCooldown = 4000; // Alarm bittikten sonraki bekleme süresi

    const statusEl = document.getElementById('status');
    const video = document.getElementById('videoInput');
    const canvas = document.getElementById('hiddenCanvas');
    const threshSlider = document.getElementById('threshold');
    const threshVal = document.getElementById('threshVal');

    threshSlider.oninput = () => { threshVal.innerText = threshSlider.value; };

    function onOpenCvReady() {
      cvReady = true;
      statusEl.innerText = "Sistem Hazır. Kamerayı başlatın.";
      document.getElementById('startCamBtn').disabled = false;
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        video.play();
        statusEl.innerText = "Kamera aktif. Şampiyon ikonu yükleyin.";
      } catch (err) {
        alert("Kamera izni alınamadı: " + err.message);
      }
    }

    function clearScales() {
      templateScales.forEach(mat => mat.delete());
      templateScales = [];
    }

    // İkonu yükle ve algılamayı güçlendirmek için 3 farklı ölçeğini oluştur
    function loadTemplate(event) {
      const file = event.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        const tCanvas = document.createElement('canvas');
        tCanvas.width = img.width;
        tCanvas.height = img.height;
        const ctx = tCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        if (baseTemplateMat) baseTemplateMat.delete();
        clearScales();

        const src = cv.imread(tCanvas);
        baseTemplateMat = new cv.Mat();
        cv.cvtColor(src, baseTemplateMat, cv.COLOR_RGBA2GRAY);
        src.delete();

        // 3 farklı boyutta şablon hazırla (%85, %100, %115) - kamera mesafesi farklarını yutar
        const scales = [0.85, 1.0, 1.15];
        scales.forEach(s => {
          let scaled = new cv.Mat();
          let dsize = new cv.Size(Math.round(baseTemplateMat.cols * s), Math.round(baseTemplateMat.rows * s));
          cv.resize(baseTemplateMat, scaled, dsize, 0, 0, cv.INTER_AREA);
          templateScales.push(scaled);
        });

        statusEl.innerText = "İkon optimize edildi! Harita taranıyor...";
        if (!isProcessing) {
          isProcessing = true;
          requestAnimationFrame(processFrame);
        }
      };
      img.src = URL.createObjectURL(file);
    }

    function processFrame() {
      if (!isProcessing || templateScales.length === 0 || video.readyState !== 4) {
        requestAnimationFrame(processFrame);
        return;
      }

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      canvas.width = vw;
      canvas.height = vh;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, vw, vh);

      const roiSize = Math.floor(Math.min(vw, vh) * 0.50);
      const startX = Math.floor((vw - roiSize) / 2);
      const startY = Math.floor((vh - roiSize) / 2);

      let src = cv.imread(canvas);
      let rect = new cv.Rect(startX, startY, roiSize, roiSize);
      let roi = src.roi(rect);

      let grayRoi = new cv.Mat();
      cv.cvtColor(roi, grayRoi, cv.COLOR_RGBA2GRAY);

      let highestScore = 0;

      // 3 boyuttan hangisi en yüksek puanı veriyorsa onu al
      for (let tMat of templateScales) {
        if (grayRoi.cols >= tMat.cols && grayRoi.rows >= tMat.rows) {
          let result = new cv.Mat();
          cv.matchTemplate(grayRoi, tMat, result, cv.TM_CCOEFF_NORMED);
          let minMax = cv.minMaxLoc(result);
          if (minMax.maxVal > highestScore) {
            highestScore = minMax.maxVal;
          }
          result.delete();
        }
      }

      const currentThresh = parseFloat(threshSlider.value);
      const now = Date.now();

      if (highestScore >= currentThresh && (now - lastAlertTime > alertCooldown)) {
        triggerAlert(highestScore);
        lastAlertTime = now;
      }

      src.delete();
      roi.delete();
      grayRoi.delete();

      setTimeout(() => {
        requestAnimationFrame(processFrame);
      }, 80);
    }

    // 2 saniye boyunca kesintisiz çalan yüksek tempolu acil durum uyarısı
    function playBeepAlarm() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // 2 saniye içinde 6 adet seri bip sesi
      const beeps = [0, 0.3, 0.6, 0.9, 1.2, 1.5, 1.8];
      
      beeps.forEach(startTime => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "square"; // Keskin ve duyulması kolay alarm tonu
        osc.frequency.setValueAtTime(1050, audioCtx.currentTime + startTime);

        gain.gain.setValueAtTime(0.8, audioCtx.currentTime + startTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime + startTime + 0.15); // Her bip 150ms sürer

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + startTime);
        osc.stop(audioCtx.currentTime + startTime + 0.16);
      });
    }

    function triggerAlert(score) {
      playBeepAlarm();
      statusEl.classList.add('status-alert');
      statusEl.innerText = `ALARM! KARAKTER BELİRDİ! (%${Math.round(score * 100)})`;
      
      setTimeout(() => {
        statusEl.classList.remove('status-alert');
        statusEl.innerText = "Harita taranıyor...";
      }, 2100);
    }
  </script>
</body>
</html>
