<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LoL Minimap Dedektörü v3</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
    }
    h3 { margin: 6px 0; font-size: 1rem; }
    .stage {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 380px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    video { width: 100%; display: block; }
    canvas#overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      background: #1e293b;
      padding: 8px;
      border-radius: 8px;
      margin: 8px auto;
      max-width: 380px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .score-box { color: #38bdf8; }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 380px;
      margin: 0 auto;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      color: white;
      cursor: pointer;
    }
    .btn-cam { background: #2563eb; }
    .btn-capture { background: #e11d48; }
    .slider-box {
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
    }
    input[type="range"] { flex: 1; }
    #templatePreview {
      width: 44px;
      height: 44px;
      border: 2px solid #38bdf8;
      border-radius: 50%;
      margin: 6px auto;
      display: none;
      background: #000;
      object-fit: cover;
    }
  </style>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="initOpenCv();"></script>
</head>
<body>

  <h3>LoL Radar v3 (Görsel Sabitleyici)</h3>

  <div class="hud">
    <span id="sysStatus">OpenCV Yükleniyor...</span>
    <span class="score-box">Mevcut Benzerlik: <span id="currentScore">%0</span></span>
  </div>

  <div class="stage">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="overlayCanvas"></canvas>
  </div>

  <canvas id="cropCanvas" style="display:none;"></canvas>
  <img id="templatePreview" alt="Hedef İkon">

  <div class="actions">
    <button class="btn-cam" id="btnCam" disabled onclick="startCam()">1. Kamerayı Başlat</button>
    <button class="btn-capture" id="btnCap" disabled onclick="captureTargetFromScreen()">2. Ortadaki Karakteri Hedef Olarak Al</button>

    <div class="slider-box">
      <span>Tetikleme Eşiği:</span>
      <input type="range" id="threshold" min="0.50" max="0.85" step="0.02" value="0.62">
      <span id="threshLabel">%62</span>
    </div>
  </div>

  <script>
    let cvReady = false;
    let templateEdges = null;
    let isTracking = false;
    let lastAlert = 0;

    const video = document.getElementById('webcam');
    const overlay = document.getElementById('overlayCanvas');
    const cropCanvas = document.getElementById('cropCanvas');
    const preview = document.getElementById('templatePreview');
    const sysStatus = document.getElementById('sysStatus');
    const scoreLabel = document.getElementById('currentScore');
    const threshSlider = document.getElementById('threshold');
    const threshLabel = document.getElementById('threshLabel');

    threshSlider.oninput = () => {
      threshLabel.innerText = `%${Math.round(threshSlider.value * 100)}`;
    };

    function initOpenCv() {
      cvReady = true;
      sysStatus.innerText = "Sistem Hazır";
      document.getElementById('btnCam').disabled = false;
    }

    async function startCam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        video.play();
        video.onloadedmetadata = () => {
          overlay.width = video.videoWidth;
          overlay.height = video.videoHeight;
          document.getElementById('btnCap').disabled = false;
          sysStatus.innerText = "Kamera Aktif";
          requestAnimationFrame(renderLoop);
        };
      } catch (e) {
        alert("Kamera izni hatası: " + e.message);
      }
    }

    // Ortadaki kılavuzdan şampiyonu tam kamera çözünürlüğünde kırpıp şablon yapar
    function captureTargetFromScreen() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const boxSize = 54; // Minimap şampiyon ikonu boyutu
      const sx = Math.floor((vw - boxSize) / 2);
      const sy = Math.floor((vh - boxSize) / 2);

      cropCanvas.width = boxSize;
      cropCanvas.height = boxSize;
      const ctx = cropCanvas.getContext('2d');
      ctx.drawImage(video, sx, sy, boxSize, boxSize, 0, 0, boxSize, boxSize);

      preview.src = cropCanvas.toDataURL();
      preview.style.display = "block";

      if (templateEdges) templateEdges.delete();

      let src = cv.imread(cropCanvas);
      let gray = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

      // Canny Edge ile parlama ve renk farklarını sıfırlıyoruz
      templateEdges = new cv.Mat();
      cv.Canny(gray, templateEdges, 50, 150);

      src.delete();
      gray.delete();

      isTracking = true;
      sysStatus.innerText = "Hedef Kilitlendi! Taranıyor...";
    }

    function renderLoop() {
      if (video.readyState === 4) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const ctx = overlay.getContext('2d');
        ctx.clearRect(0, 0, vw, vh);

        // 1. Ekranın tam ortasındaki Kırpma / Nişan dairesi
        const centerSize = 54;
        const cx = (vw - centerSize) / 2;
        const cy = (vh - centerSize) / 2;

        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 2;
        ctx.strokeRect(cx, cy, centerSize, centerSize);

        // 2. Eğer hedef tanımlandıysa tüm ekranda Canny Edge ile ara
        if (isTracking && templateEdges) {
          cropCanvas.width = vw;
          cropCanvas.height = vh;
          const cCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
          cCtx.drawImage(video, 0, 0, vw, vh);

          let frame = cv.imread(cropCanvas);
          let grayFrame = new cv.Mat();
          cv.cvtColor(frame, grayFrame, cv.COLOR_RGBA2GRAY);

          let frameEdges = new cv.Mat();
          cv.Canny(grayFrame, frameEdges, 50, 150);

          let result = new cv.Mat();
          cv.matchTemplate(frameEdges, templateEdges, result, cv.TM_CCOEFF_NORMED);

          let minMax = cv.minMaxLoc(result);
          let matchScore = minMax.maxVal > 0 ? minMax.maxVal : 0;
          scoreLabel.innerText = `%${Math.round(matchScore * 100)}`;

          const threshold = parseFloat(threshSlider.value);

          // Eşik aşıldıysa yeşil kutu çiz ve alarm çal
          if (matchScore >= threshold) {
            ctx.strokeStyle = "#22c55e";
            ctx.lineWidth = 4;
            ctx.strokeRect(minMax.maxLoc.x, minMax.maxLoc.y, templateEdges.cols, templateEdges.rows);

            const now = Date.now();
            if (now - lastAlert > 3500) {
              soundEmergencyAlarm();
              lastAlert = now;
            }
          }

          frame.delete();
          grayFrame.delete();
          frameEdges.delete();
          result.delete();
        }
      }
      setTimeout(() => requestAnimationFrame(renderLoop), 70);
    }

    // 2 saniyelik net alarm
    function soundEmergencyAlarm() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const beeps = [0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5];

      beeps.forEach(t => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(950, audioCtx.currentTime + t);

        gain.gain.setValueAtTime(0.7, audioCtx.currentTime + t);
        gain.gain.setValueAtTime(0.01, audioCtx.currentTime + t + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + t);
        osc.stop(audioCtx.currentTime + t + 0.13);
      });
    }
  </script>
</body>
</html>
