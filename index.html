<!DOCTYPE html>
<html lang="tr">
<head>

  <title>Master Yi Radar (Hızlı Yükleme)</title>
  <style>
    * { box-sizing: border-box; }
    body {

    h3 { margin: 6px 0; font-size: 1rem; color: #fbbf24; }
    .stage {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 380px;
      background: #000;

      overflow: hidden;
    }
    video { width: 100%; display: block; }
    canvas#overlayCanvas {

      background: #1e293b;

      border-radius: 8px;

      max-width: 380px;

      font-weight: bold;

    .score-box { color: #38bdf8; }
    .actions {

      max-width: 380px;

    }
    button {

      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;

      cursor: pointer;

      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
    }
    input[type="range"] { flex: 1; }
    .num-input {
      width: 65px;
      padding: 6px;
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      color: #38bdf8;
      font-weight: bold;
      text-align: center;
      font-size: 0.9rem;
    }
    #templatePreview {
      width: 48px;
      height: 48px;
      border: 2px solid #fbbf24;
      border-radius: 50%;
      margin: 6px auto;
      display: none;
      background: #000;
      object-fit: cover;
    }
  </style>
</head>

    </div>
  </div>

  <script>
    const OPENCV_URL = "https://cdnjs.cloudflare.com/ajax/libs/opencv.js/4.8.0/opencv.js";
    const DB_NAME = "OpenCV_Storage";
    const STORE_NAME = "scripts";

    const sysStatus = document.getElementById('sysStatus');
    const btnCam = document.getElementById('btnCam');

    // 1. IndexedDB ile telefona kalıcı kaydetme motoru
    function getDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function loadOpenCvFast() {
      try {
        const db = await getDb();
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const getReq = store.get("opencv_js");

        getReq.onsuccess = async () => {
          let code = getReq.result;
          if (code) {
            sysStatus.innerText = "Hafızadan yükleniyor...";
            injectScript(code);
          } else {
            sysStatus.innerText = "İndiriliyor (Tek Seferlik)...";
            const res = await fetch(OPENCV_URL);
            code = await res.text();
            
            // Telefona yaz
            const writeTx = db.transaction(STORE_NAME, "readwrite");
            writeTx.objectStore(STORE_NAME).put(code, "opencv_js");
            injectScript(code);
          }
        };
      } catch (e) {
        // Fallback: Standart script enjekte et
        const s = document.createElement('script');
        s.src = OPENCV_URL;
        s.onload = checkReadyLoop;
        document.head.appendChild(s);
      }
    }

    function injectScript(code) {
      const s = document.createElement('script');
      s.text = code;
      document.head.appendChild(s);
      checkReadyLoop();
    }
