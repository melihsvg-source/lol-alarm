<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Master Yi Minimap Dedektörü</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
    }
    h3 { margin: 6px 0; font-size: 1rem; color: #fbbf24; }
    .stage {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 380px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    video { width: 100%; display: block; }
    canvas#overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      background: #1e293b;
      padding: 8px;
      border-radius: 8px;
      margin: 8px auto;
      max-width: 380px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .score-box { color: #38bdf8; }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 380px;
      margin: 0 auto;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      color: white;
      cursor: pointer;
    }
    .btn-cam { background: #2563eb; }
    .btn-capture { background: #d97706; }
    .slider-box {
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
    }
    input[type="range"] { flex: 1; }
    #templatePreview {
      width: 48px;
      height: 48px;
      border: 2px solid #fbbf24;
      border-radius: 50%;
      margin: 6px auto;
      display: none;
      background: #000;
      object-fit: cover;
    }
  </style>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="initOpenCv();"></script>
</head>
<body>

  <h3>Master Yi Radar (Maskeli Takip)</h3>

  <div class="hud">
    <span id="sysStatus">OpenCV Yükleniyor...</span>
    <span class="score-box">Eşleşme: <span id="currentScore">%0</span></span>
  </div>

  <div class="stage">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="overlayCanvas"></canvas>
  </div>

  <canvas id="cropCanvas" style="display:none;"></canvas>
  <img id="templatePreview" alt="Yi İkonu">

  <div class="actions">
    <button class="btn-cam" id="btnCam" disabled onclick="startCam()">1. Kamerayı Başlat</button>
    <button class="btn-capture" id="btnCap" disabled onclick="captureYi()">2. Ortadaki Yi'yi Kilitle (Daire)</button>

    <div class="slider-box">
      <span>Tetikleme Eşiği:</span>
      <input type="range" id="threshold" min="0.55" max="0.85" step="0.02" value="0.65">
      <span id="threshLabel">%65</span>
    </div>
  </div>

  <script>
    let cvReady = false;
    let baseTemplate = null;
    let baseMask = null;
    let scaledTemplates = [];
    let isTracking = false;
    let lastAlert = 0;

    const video = document.getElementById('webcam');
    const overlay = document.getElementById('overlayCanvas');
    const cropCanvas = document.getElementById('cropCanvas');
    const preview = document.getElementById('templatePreview');
    const sysStatus = document.getElementById('sysStatus');
    const scoreLabel = document.getElementById('currentScore');
    const threshSlider = document.getElementById('threshold');
    const threshLabel = document.getElementById('threshLabel');

    threshSlider.oninput = () => {
      threshLabel.innerText = `%${Math.round(threshSlider.value * 100)}`;
    };

    function initOpenCv() {
      cvReady = true;
      sysStatus.innerText = "Sistem Hazır";
      document.getElementById('btnCam').disabled = false;
    }

    async function startCam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        video.play();
        video.onloadedmetadata = () => {
          overlay.width = video.videoWidth;
          overlay.height = video.videoHeight;
          document.getElementById('btnCap').disabled = false;
          sysStatus.innerText = "Kamera Aktif";
          requestAnimationFrame(renderLoop);
        };
      } catch (e) {
        alert("Kamera hatası: " + e.message);
      }
    }

    function clearTemplates() {
      scaledTemplates.forEach(item => {
        item.tpl.delete();
        item.msk.delete();
      });
      scaledTemplates = [];
    }

    // Yi'yi çekerken dışındaki köşeleri tamamen silip sadece yuvarlak daireyi maske yapıyoruz
    function captureYi() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const boxSize = 52; // Yi'nin minimap portre çapı
      const sx = Math.floor((vw - boxSize) / 2);
      const sy = Math.floor((vh - boxSize) / 2);

      cropCanvas.width = boxSize;
      cropCanvas.height = boxSize;
      const ctx = cropCanvas.getContext('2d');
      ctx.drawImage(video, sx, sy, boxSize, boxSize, 0, 0, boxSize, boxSize);

      preview.src = cropCanvas.toDataURL();
      preview.style.display = "block";

      if (baseTemplate) baseTemplate.delete();
      if (baseMask) baseMask.delete();
      clearTemplates();

      let src = cv.imread(cropCanvas);
      baseTemplate = new cv.Mat();
      cv.cvtColor(src, baseTemplate, cv.COLOR_RGBA2GRAY);

      // Zemin yeşilliğini/nehir dokusunu yoksaymak için yuvarlak maske oluştur
      baseMask = new cv.Mat.zeros(boxSize, boxSize, cv.CV_8UC1);
      let center = new cv.Point(boxSize / 2, boxSize / 2);
      cv.circle(baseMask, center, Math.floor(boxSize / 2) - 2, new cv.Scalar(255), -1);

      // Farklı mesafeler için 3 ölçek hazırla
      const scales = [0.90, 1.0, 1.10];
      scales.forEach(s => {
        let tpl = new cv.Mat();
        let msk = new cv.Mat();
        let dsize = new cv.Size(Math.round(boxSize * s), Math.round(boxSize * s));
        cv.resize(baseTemplate, tpl, dsize, 0, 0, cv.INTER_LINEAR);
        cv.resize(baseMask, msk, dsize, 0, 0, cv.INTER_NEAREST);
        scaledTemplates.push({ tpl, msk, w: dsize.width, h: dsize.height });
      });

      src.delete();
      isTracking = true;
      sysStatus.innerText = "Yi Kilitlendi! Taranıyor...";
    }

    function renderLoop() {
      if (video.readyState === 4) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const ctx = overlay.getContext('2d');
        ctx.clearRect(0, 0, vw, vh);

        // Ortadaki hedef dairesi
        const centerSize = 52;
        const cx = vw / 2;
        const cy = vh / 2;

        ctx.strokeStyle = "#fbbf24";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, centerSize / 2, 0, 2 * Math.PI);
        ctx.stroke();

        if (isTracking && scaledTemplates.length > 0) {
          cropCanvas.width = vw;
          cropCanvas.height = vh;
          const cCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
          cCtx.drawImage(video, 0, 0, vw, vh);

          let frame = cv.imread(cropCanvas);
          let grayFrame = new cv.Mat();
          cv.cvtColor(frame, grayFrame, cv.COLOR_RGBA2GRAY);

          let bestVal = 0;
          let bestLoc = null;
          let bestSize = null;

          // Maskeli eşleme döngüsü (Arka plan dokusunu sıfırlayarak sadece yüzü arar)
          for (let item of scaledTemplates) {
            if (grayFrame.cols >= item.w && grayFrame.rows >= item.h) {
              let result = new cv.Mat();
              // cv.TM_CCORR_NORMED maske desteği olan en stabil metriktir
              cv.matchTemplate(grayFrame, item.tpl, result, cv.TM_CCORR_NORMED, item.msk);
              let minMax = cv.minMaxLoc(result);
              if (minMax.maxVal > bestVal) {
                bestVal = minMax.maxVal;
                bestLoc = minMax.maxLoc;
                bestSize = { w: item.w, h: item.h };
              }
              result.delete();
            }
          }

          scoreLabel.innerText = `%${Math.round(bestVal * 100)}`;
          const threshold = parseFloat(threshSlider.value);

          // Eşik aşıldığında Yi'nin etrafını sarı kareye al ve ötmeye başla
          if (bestVal >= threshold && bestLoc) {
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 4;
            ctx.strokeRect(bestLoc.x, bestLoc.y, bestSize.w, bestSize.h);

            const now = Date.now();
            if (now - lastAlert > 3000) {
              playAlert();
              lastAlert = now;
            }
          }

          frame.delete();
          grayFrame.delete();
        }
      }
      setTimeout(() => requestAnimationFrame(renderLoop), 80);
    }

    function playAlert() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const beeps = [0, 0.22, 0.44, 0.66, 0.88, 1.1, 1.32];

      beeps.forEach(t => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(1150, audioCtx.currentTime + t);

        gain.gain.setValueAtTime(0.8, audioCtx.currentTime + t);
        gain.gain.setValueAtTime(0.01, audioCtx.currentTime + t + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + t);
        osc.stop(audioCtx.currentTime + t + 0.13);
      });
    }
  </script>
</body>
</html>
