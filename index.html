<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LoL Minimap Dedektörü</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h2 { margin: 8px 0; font-size: 1.1rem; }
    .video-container {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    video { width: 100%; display: block; }
    .target-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border: 3px dashed #ef4444;
      border-radius: 8px;
      pointer-events: none;
    }
    .status-badge {
      display: inline-block;
      margin: 10px 0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #334155;
    }
    .status-alert {
      background: #dc2626 !important;
      animation: pulse 0.5s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 420px;
      margin: 10px auto;
    }
    button, label.file-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    label.file-btn { background: #059669; display: block; }
    input[type="file"] { display: none; }
    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    input[type="range"] { flex: 1; margin: 0 10px; }
  </style>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
</head>
<body>

  <h2>LoL Minimap Dedektörü</h2>
  <div id="status" class="status-badge">Sistem Yükleniyor...</div>

  <div class="video-container">
    <video id="videoInput" playsinline autoplay muted></video>
    <div class="target-box" id="targetBox"></div>
  </div>

  <div class="controls">
    <button id="startCamBtn" disabled onclick="startCamera()">1. Kamerayı Başlat</button>
    
    <label class="file-btn">
      2. Şampiyon İkonunu Seç (.png)
      <input type="file" id="templateInput" accept="image/*" onchange="loadTemplate(event)">
    </label>

    <div class="slider-row">
      <span>Hassasiyet:</span>
      <input type="range" id="threshold" min="0.60" max="0.95" step="0.02" value="0.78">
      <span id="threshVal">0.78</span>
    </div>
  </div>

  <canvas id="hiddenCanvas" style="display:none;"></canvas>

  <script>
    let cvReady = false;
    let templateMat = null;
    let isProcessing = false;
    let lastAlertTime = 0;
    const alertCooldown = 5000;

    const statusEl = document.getElementById('status');
    const video = document.getElementById('videoInput');
    const canvas = document.getElementById('hiddenCanvas');
    const threshSlider = document.getElementById('threshold');
    const threshVal = document.getElementById('threshVal');

    threshSlider.oninput = () => { threshVal.innerText = threshSlider.value; };

    function onOpenCvReady() {
      cvReady = true;
      statusEl.innerText = "Sistem Hazır. Kamerayı başlatın.";
      document.getElementById('startCamBtn').disabled = false;
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        video.play();
        statusEl.innerText = "Kamera aktif. Şampiyon ikonu yükleyin.";
      } catch (err) {
        alert("Kamera izni alınamadı: " + err.message);
      }
    }

    function loadTemplate(event) {
      const file = event.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        const tCanvas = document.createElement('canvas');
        tCanvas.width = img.width;
        tCanvas.height = img.height;
        const ctx = tCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        if (templateMat) templateMat.delete();
        const src = cv.imread(tCanvas);
        templateMat = new cv.Mat();
        cv.cvtColor(src, templateMat, cv.COLOR_RGBA2GRAY);
        src.delete();

        statusEl.innerText = "İkon yüklendi! Harita taranıyor...";
        if (!isProcessing) {
          isProcessing = true;
          requestAnimationFrame(processFrame);
        }
      };
      img.src = URL.createObjectURL(file);
    }

    function processFrame() {
      if (!isProcessing || !templateMat || video.readyState !== 4) {
        requestAnimationFrame(processFrame);
        return;
      }

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      canvas.width = vw;
      canvas.height = vh;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, vw, vh);

      const roiSize = Math.floor(Math.min(vw, vh) * 0.45);
      const startX = Math.floor((vw - roiSize) / 2);
      const startY = Math.floor((vh - roiSize) / 2);

      let src = cv.imread(canvas);
      let rect = new cv.Rect(startX, startY, roiSize, roiSize);
      let roi = src.roi(rect);

      let grayRoi = new cv.Mat();
      cv.cvtColor(roi, grayRoi, cv.COLOR_RGBA2GRAY);

      let result = new cv.Mat();
      cv.matchTemplate(grayRoi, templateMat, result, cv.TM_CCOEFF_NORMED);

      let minMax = cv.minMaxLoc(result);
      let maxVal = minMax.maxVal;
      const currentThresh = parseFloat(threshSlider.value);

      const now = Date.now();
      if (maxVal >= currentThresh && (now - lastAlertTime > alertCooldown)) {
        triggerAlert(maxVal);
        lastAlertTime = now;
      }

      src.delete();
      roi.delete();
      grayRoi.delete();
      result.delete();

      setTimeout(() => {
        requestAnimationFrame(processFrame);
      }, 70);
    }

    function playBeep() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.35);

      gain.gain.setValueAtTime(1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }

    function triggerAlert(score) {
      playBeep();
      statusEl.classList.add('status-alert');
      statusEl.innerText = `DİKKAT! ŞAMPİYON GÖRÜNDÜ (%${Math.round(score * 100)})`;
      
      setTimeout(() => {
        statusEl.classList.remove('status-alert');
        statusEl.innerText = "Taranıyor...";
      }, 2000);
    }
  </script>
</body>
</html>
