<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Master Yi Radar v6</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
    }
    h3 { margin: 6px 0; font-size: 1rem; color: #fbbf24; }
    .stage {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 380px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    video { width: 100%; display: block; }
    canvas#overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      background: #1e293b;
      padding: 8px;
      border-radius: 8px;
      margin: 8px auto;
      max-width: 380px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .score-box { color: #38bdf8; }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 380px;
      margin: 0 auto;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      color: white;
      cursor: pointer;
    }
    .btn-cam { background: #2563eb; }
    .btn-capture { background: #d97706; }
    .slider-box {
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
    }
    input[type="range"] { flex: 1; }
    .num-input {
      width: 65px;
      padding: 6px;
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      color: #38bdf8;
      font-weight: bold;
      text-align: center;
      font-size: 0.9rem;
    }
    #templatePreview {
      width: 48px;
      height: 48px;
      border: 2px solid #fbbf24;
      border-radius: 50%;
      margin: 6px auto;
      display: none;
      background: #000;
      object-fit: cover;
    }
  </style>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="initOpenCv();"></script>
</head>
<body>

  <h3>Master Yi Radar (Manuel Eşik Kontrolü)</h3>

  <div class="hud">
    <span id="sysStatus">OpenCV Yükleniyor...</span>
    <span class="score-box">Anlık Benzerlik: <span id="currentScore">%0.0</span></span>
  </div>

  <div class="stage">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="overlayCanvas"></canvas>
  </div>

  <canvas id="cropCanvas" style="display:none;"></canvas>
  <img id="templatePreview" alt="Yi İkonu">

  <div class="actions">
    <button class="btn-cam" id="btnCam" disabled onclick="startCam()">1. Kamerayı Başlat</button>
    <button class="btn-capture" id="btnCap" disabled onclick="captureYi()">2. Ortadaki Yi'yi Kilitle</button>

    <div class="slider-box">
      <span>Eşik (%):</span>
      <input type="range" id="threshold" min="80.0" max="99.9" step="0.1" value="97.0">
      <input type="number" id="thresholdNum" class="num-input" min="80.0" max="99.9" step="0.1" value="97.0">
    </div>
  </div>

  <script>
    let cvReady = false;
    let baseTemplate = null;
    let scaledTemplates = [];
    let isTracking = false;
    let isAlarmPlaying = false;

    const video = document.getElementById('webcam');
    const overlay = document.getElementById('overlayCanvas');
    const cropCanvas = document.getElementById('cropCanvas');
    const preview = document.getElementById('templatePreview');
    const sysStatus = document.getElementById('sysStatus');
    const scoreLabel = document.getElementById('currentScore');
    const threshSlider = document.getElementById('threshold');
    const threshNum = document.getElementById('thresholdNum');

    // Slider değişince kutuyu güncelle
    threshSlider.oninput = () => {
      threshNum.value = parseFloat(threshSlider.value).toFixed(1);
    };

    // Kutudan elle yazılınca slider'ı güncelle
    threshNum.oninput = () => {
      let val = parseFloat(threshNum.value);
      if (!isNaN(val)) {
        threshSlider.value = val;
      }
    };

    function initOpenCv() {
      cvReady = true;
      sysStatus.innerText = "Sistem Hazır";
      document.getElementById('btnCam').disabled = false;
    }

    async function startCam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        video.play();
        video.onloadedmetadata = () => {
          overlay.width = video.videoWidth;
          overlay.height = video.videoHeight;
          document.getElementById('btnCap').disabled = false;
          sysStatus.innerText = "Kamera Aktif";
          requestAnimationFrame(renderLoop);
        };
      } catch (e) {
        alert("Kamera hatası: " + e.message);
      }
    }

    function clearTemplates() {
      scaledTemplates.forEach(t => t.delete());
      scaledTemplates = [];
    }
